# Custom Validation Rules for CatalogIQ
#
# Place this file (or a copy) in the Dashboard to extend the built-in
# validation pipeline without modifying Python source code.
#
# Supported sections:
#   lov            - Additional allowed-value lists
#   uom            - Additional unit-of-measure entries
#   anomaly_rules  - Category-specific anomaly thresholds

lov:
  Faucets:
    Finish:
      - "Polished Nickel"
      - "Matte Black"
  Valves:
    Material:
      - "Brass"
      - "Stainless Steel"
      - "PVC"

uom:
  m:
    normalized: "m"
    template: "{value} m"
  cm:
    normalized: "cm"
    template: "{value} cm"

anomaly_rules:
  - category: "Valves"
    attribute: "weight"
    unit: "kg"
    max_value: 200
    message: "Valve weight over 200 kg is unusual for this category"
  - category: "Faucets"
    attribute: "weight"
    unit: "lb"
    max_value: 100
    message: "Faucet weight over 100 lb is unusual for this category"
